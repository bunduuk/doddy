<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { width: 400px; margin: 0; font: 13px -apple-system, system-ui, sans-serif; color: #eef0fb; background: #0f1226; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #232850; background: linear-gradient(180deg,#171b3a,#0f1226); }
  header img { width: 28px; height: 28px; border-radius: 8px; }
  header i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg,#f5894c,#db5c8f 55%,#a843bd); display: grid; place-items: center; }
  header i svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  header b { font-size: 15px; }
  .page { padding: 12px 16px; border-bottom: 1px solid #232850; display: flex; gap: 10px; align-items: center; }
  .page span { flex: 1; color: #aab0d6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list { max-height: 360px; overflow-y: auto; padding: 6px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; }
  .row:hover { background: #1b2046; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-weight: 500; }
  .row .t small { color: #8c93c4; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  button { background: linear-gradient(135deg,#f5894c,#db5c8f 55%,#a843bd); color: #fff; border: 0; border-radius: 999px; padding: 6px 13px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  button.alt { background: #2a2f5e; font-weight: 500; }
  button:hover { filter: brightness(1.12); }
  #list:empty { display: none; }
  .grab { padding: 6px 16px 14px; }
  .grab button { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 12px; border: 1px solid #343a70; font-size: 13px; }
  .grab button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .empty { padding: 22px 16px; color: #8c93c4; line-height: 1.55; text-align: center; }
  #msg { padding: 0 16px 12px; color: #f5a56b; min-height: 1.2em; }
  .set { margin: 0 16px 14px; padding: 12px 14px; background: #1a1e3f; border: 1px solid #2a2f5e; border-radius: 16px; }
  .set h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8c93c4; }
  .set label.sw { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .set label.sw span { flex: 1; font-weight: 500; }
  .set label.sw small { display: block; color: #8c93c4; font-weight: 400; margin-top: 2px; }
  .set input[type=checkbox] { appearance: none; width: 36px; height: 21px; border-radius: 99px; background: #3a4070; position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .set input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: left .15s; }
  .set input[type=checkbox]:checked { background: linear-gradient(135deg,#f5894c,#db5c8f 55%,#a843bd); }
  .set input[type=checkbox]:checked::after { left: 17px; }
  .set .more { margin-top: 12px; display: none; }
  .set .more.on { display: block; }
  .set .more label { display: block; color: #aab0d6; margin-bottom: 9px; }
  .set .more input { width: 100%; margin-top: 4px; background: #0f1226; color: #eef0fb; border: 1px solid #2f3566; border-radius: 8px; padding: 6px 9px; font: inherit; }
</style>
<header><img src="icons/icon48.png" alt=""><b>Doddy</b></header>
<div class="page"><span id="page">This page</span><button id="best">Best quality</button></div>
<div id="extras" style="display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap"></div>
<div id="list"></div>
<div class="grab"><button class="alt" id="grab" title="List every link, file and picture on this page and choose which to download"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Grab links on this page…</button></div>
<div class="set">
  <h4>Settings</h4>
  <label class="sw"><span>Take over Chrome downloads<small>Big files and .torrent files go to Doddy.</small></span><input type="checkbox" id="takeover"></label>
  <label class="sw" style="margin-top:12px"><span>Auto-play to find video<small>Mutes the video briefly while Doddy finds it.</small></span><input type="checkbox" id="autoPlay"></label>
  <div class="more" id="more">
    <label>Only files bigger than (MB)<input type="number" id="takeoverMinMB" min="0"></label>
    <label>File types<input type="text" id="takeoverExts"></label>
    <label style="margin-bottom:0">Never take over these sites<input type="text" id="takeoverExclude" placeholder="example.com, mybank.co.uk"></label>
  </div>
</div>
<div id="msg"></div>
<script src="popup.js"></script>
